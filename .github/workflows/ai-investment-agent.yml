name: AI Investment Agent Runner

# Runs the paper-trading agent on a schedule so it keeps evaluating real
# Finnhub prices whether or not anyone has the dashboard open. See
# ai-investment-agent/agent/run.mjs for the actual logic.
on:
  # Offset away from :00/:15/:30/:45 on purpose: GitHub's docs note that
  # scheduled workflows are best-effort and get delayed/dropped most under
  # load at the top of common intervals, since every repo's simple cron
  # piles up at the same instants. Firing a few minutes off that boundary
  # measurably improves the odds this actually runs on time.
  schedule:
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset the simulation to a fresh starting state instead of running a normal cycle"
        required: false
        default: false
        type: boolean

# Needed so the job can commit the updated state.json back to the repo.
permissions:
  contents: write

# Prevent two runs from overlapping and racing on the same commit.
concurrency:
  group: ai-investment-agent-runner
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run agent, commit, and push (retrying against fresh state on a push race)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RESET: ${{ github.event.inputs.reset }}
        run: |
          git config user.name "ai-investment-agent-bot"
          git config user.email "actions@users.noreply.github.com"

          # Two runs can land close enough together (a native GitHub Actions
          # `schedule:` fire, a manual dispatch, and the hourly backstop
          # trigger all hit the same workflow) that both compute a trade
          # against the same starting state.json before either has pushed.
          # Their results are two DIFFERENT valid trajectories from the same
          # point — there's no sensible way to git-merge that at the content
          # level, so on a push race we throw away the loser's commit and
          # simply recompute from whatever is now on origin instead of
          # attempting a rebase/merge.
          for attempt in 1 2 3 4 5; do
            node ai-investment-agent/agent/run.mjs

            git add ai-investment-agent/data/state.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              break
            fi
            git commit -m "Agent run: update portfolio state"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed successfully on attempt ${attempt}."
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::Still couldn't push after 5 attempts — giving up."
              exit 1
            fi
            echo "Push rejected (another run landed first) — resetting to the latest state and recomputing."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
          done
